services:
  - type: web
    name: sistema-teologico-cpad
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: postgres-teologico
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
    healthCheckPath: /health

databases:
  - name: postgres-teologico
    databaseName: teologico_db
    user: teologico_user
    plan: free