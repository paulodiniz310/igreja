services:
  - type: web
    name: sistema-teologico-cpad
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.3
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1